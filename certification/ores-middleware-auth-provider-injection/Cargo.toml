[package]
name = "fiducia-ores-middleware-auth-provider-certification"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", rev = "3c69479fb7145bf8c279ba9abfe4d652dfc7c94c", default-features = false, features = ["axum"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "fiducia-ores-middleware-auth-provider-certification"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", rev = "e0a775fa73f2398a8dd0ead1b0b8609f0ac56e8d", default-features = false, features = ["axum"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "fiducia-ores-middleware-auth-provider-certification"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", rev = "f9d9b8a35318388f6f9f049e678227499f9fd152", default-features = false, features = ["axum"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
